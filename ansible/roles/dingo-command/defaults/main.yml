---
dingo_command_services:
  dingo-command:
    container_name: dingo-command
    group: dingo-command
    enabled: true
    image: "{{ dingo_command_image_full }}"
    volumes: "{{ dingo_command_default_volumes + dingo_command_extra_volumes }}"
    dimensions: "{{ dingo_command_dimensions }}"
    healthcheck: "{{ dingo_command_healthcheck }}"
    haproxy:
      dingo-command:
        enabled: "{{ enable_dingo_command }}"
        mode: "http"
        external: false
        port: "{{ dingo_command_port }}"
        listen_port: "{{ dingo_command_listen_port }}"
        tls_backend: "{{ dingo_command_enable_tls_backend }}"
        backend_http_extra:
          - "option httpchk GET /docs"
      dingo_command_external:
        enabled: "{{ enable_dingo_command }}"
        mode: "http"
        external: true
        external_fqdn: "{{ dingo_command_external_fqdn }}"
        port: "{{ dingo_command_port }}"
        listen_port: "{{ dingo_command_listen_port }}"
        tls_backend: "{{ dingo_command_enable_tls_backend }}"
        backend_http_extra:
          - "option httpchk GET /docs"
  
dingo_bear_services:
  dingo-bear:
    container_name: dingo-bear
    group: dingo-bear
    enabled: true
    image: "{{ dingo_bear_image_full }}"
    volumes: "{{ dingo_bear_default_volumes + dingo_bear_extra_volumes }}"
    dimensions: "{{ dingo_bear_dimensions }}"
    healthcheck: "{{ dingo_bear_healthcheck }}"
    haproxy:
      dingo-bear:
        enabled: "{{ enable_dingo_bear }}"
        mode: "http"
        external: false
        port: "{{ dingo_bear_port }}"
        listen_port: "{{ dingo_bear_listen_port }}"
        tls_backend: "{{ dingo_bear_enable_tls_backend }}"
        backend_http_extra:
          - "option httpchk GET /docs"
      dingo_bear_external:
        enabled: "{{ enable_dingo_bear }}"
        mode: "http"
        external: true
        external_fqdn: "{{ dingo_bear_external_fqdn }}"
        port: "{{ dingo_bear_port }}"
        listen_port: "{{ dingo_bear_listen_port }}"
        tls_backend: "{{ dingo_bear_enable_tls_backend }}"
        backend_http_extra:
          - "option httpchk GET /docs"

dingo_command_database_address: "{{ database_address | put_address_in_context('url') }}:{{ database_port }}"
dingo_command_tag: "{{ openstack_tag }}"
#optional ceph nfs local
dingo_command_workerdir_storage_type: "local"
dingo_command_workerdir_storage_local_path: "/var/lib/dingo-command"

dingo_command_workerdir_storage_nfs_path: "{{ dingo_command_workerdir_storage_nfs_path }}"

dingo_command_image: "{{ docker_registry ~ '/' if docker_registry else '' }}{{ docker_namespace }}/dingo-command"
dingo_command_image_full: "{{ dingo_command_image }}:{{ dingo_command_tag }}"
dingo_command_config_directory: "/etc/dingo-command"
dingo_command_default_volumes:
  - "{{ node_config_directory }}/dingo-command/:{{ dingo_command_config_directory }}/:ro"
  - "/etc/localtime:/etc/localtime:ro"
  - "{{ '/etc/timezone:/etc/timezone:ro' if ansible_facts.os_family == 'Debian' else '' }}"
  - "/var/log/kolla/dingo-command/:/var/log/dingo-command/"
  - "/run/netns:/run/netns:shared"
  - "{{ dingo_command_workerdir_storage_local_path }}/:/var/lib/dingo-command/"

dingo_command_extra_volumes: "{{ default_extra_volumes }}"
dingo_command_dimensions: "{{ default_container_dimensions }}"

dingo_command_enable_healthchecks: "{{ enable_container_healthchecks }}"
dingo_command_healthcheck_interval: "{{ default_container_healthcheck_interval }}"
dingo_command_healthcheck_retries: "{{ default_container_healthcheck_retries }}"
dingo_command_healthcheck_start_period: "{{ default_container_healthcheck_start_period }}"
dingo_command_healthcheck_test: ["CMD-SHELL", "curl --max-time 10 http://{{ api_interface_address | put_address_in_context('url') }}:{{ dingo_command_listen_port }}/docs"]
dingo_command_healthcheck_timeout: "{{ default_container_healthcheck_timeout }}"
dingo_command_healthcheck:
  interval: "{{ dingo_command_healthcheck_interval }}"
  retries: "{{ dingo_command_healthcheck_retries }}"
  start_period: "{{ dingo_command_healthcheck_start_period }}"
  test: "{% if dingo_command_enable_healthchecks | bool %}{{ dingo_command_healthcheck_test }}{% else %}NONE{% endif %}"
  timeout: "{{ dingo_command_healthcheck_timeout }}"

openstack_dingo_command_auth: "{{ openstack_auth }}"
dingo_command_port: 8887
dingo_command_public_port: 8887
dingo_command_listen_port: "{{ dingo_command_port }}"
####################
# OpenStack
####################
dingo_command_internal_base_endpoint: "{{ dingo_command_internal_fqdn | kolla_url(internal_protocol, dingo_command_port) }}"
dingo_command_public_base_endpoint: "{{ dingo_command_external_fqdn | kolla_url(public_protocol, dingo_command_public_port) }}"

dingo_command_ks_services:
  - name: "dingo-command"
    type: "panel"
    description: "OpenStack assets Service"
    endpoints:
      - {'interface': 'internal', 'url': '{{ dingo_command_internal_base_endpoint }}'}
      - {'interface': 'public', 'url': '{{ dingo_command_public_base_endpoint }}'}

dingo_command_ks_users:
  - project: "service"
    user: "{{ dingo_command_keystone_user }}"
    password: "{{ dingo_command_keystone_password }}"
    role: "admin"

####################
# Database
####################
dingo_command_database_name: "dingoops"
dingo_command_database_user: "{% if use_preconfigured_databases | bool and use_common_mariadb_user | bool %}{{ database_user }}{% else %}dingoops{% endif %}"
dingo_command_database_address: "{{ database_address | put_address_in_context('url') }}:{{ database_port }}"
####################
# Database sharding
####################
dingo_command_database_shard_root_user: "{% if enable_proxysql | bool %}root_shard_{{ dingo_command_database_shard_id }}{% else %}{{ database_user }}{% endif %}"
dingo_command_database_shard_id: "{{ mariadb_default_database_shard_id | int }}"
dingo_command_database_shard:
  users:
    - user: "{{ dingo_command_database_user }}"
      password: "{{ dingo_command_database_password }}"
  rules:
    - schema: "{{ dingo_command_database_name }}"
      shard_id: "{{ dingo_command_database_shard_id }}"


####################
# TLS
####################
dingo_command_enable_tls_backend: "{{ kolla_enable_tls_backend }}"

