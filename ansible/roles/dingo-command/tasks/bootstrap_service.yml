---
- name: Running dingo-command bootstrap container
  vars:
    dingo-command: "{{ dingo_command_services['dingo-command'] }}"
  become: true
  kolla_container:
    action: "start_container"
    common_options: "{{ docker_common_options }}"
    detach: False
    environment:
      KOLLA_BOOTSTRAP:
      KOLLA_CONFIG_STRATEGY: "{{ config_strategy }}"
    image: "{{ dingo-command.image }}"
    labels:
      BOOTSTRAP:
    name: "dingo-command"
    restart_policy: oneshot
    volumes: "{{ dingo-command.volumes | reject('equalto', '') | list }}"
  run_once: True
  delegate_to: "{{ groups[dingo-command.group][0] }}"
