---
- import_role:
    name: service-precheck
  vars:
    service_precheck_services: "{{ dingo-command_services }}"
    service_name: "{{ project_name }}"

- name: Get container facts
  become: true
  kolla_container_facts:
    action: get_containers
    container_engine: "{{ kolla_container_engine }}"
    name:
      - dingo-command
      - dingo-command_console
  register: container_facts

- name: Checking free port for dingo-command APIServer
  wait_for:
    host: "{{ api_interface_address }}"
    port: "{{ dingo-command_listen_port }}"
    connect_timeout: 1
    timeout: 1
    state: stopped
  when:
    - container_facts['dingo-command'] is not defined
    - inventory_hostname in groups['dingo-command']

- name: Checking free port for dingo-command Console
  wait_for:
    host: "{{ api_interface_address }}"
    port: "{{ dingo-command_console_listen_port }}"
    connect_timeout: 1
    timeout: 1
    state: stopped
  when:
    - container_facts['dingo-command_console'] is not defined
    - inventory_hostname in groups['dingo-command-console']
