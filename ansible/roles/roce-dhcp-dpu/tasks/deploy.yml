---
- include_tasks: pull.yml
- include_tasks: config.yml

- name: Ensure roce-dhcp internal port exists on OVS bridge (DPU)
  become: true
  shell: |
    ovs-vsctl br-exists br-roce && ovs-vsctl del-br br-roce || true
    ovs-vsctl port-to-br roce-dhcp 2>/dev/null | grep -q {{ roce_dhcp_dpu_ovs_bridge }} || \
      ovs-vsctl add-port {{ roce_dhcp_dpu_ovs_bridge }} roce-dhcp -- set Interface roce-dhcp type=internal
    ip link set roce-dhcp up || true

- name: Install roce-dhcp-dpu systemd service
  become: true
  template:
    src: roce-dhcp-dpu.service.j2
    dest: /etc/systemd/system/roce-dhcp.service
    mode: '0644'
  notify: restart roce-dhcp-dpu

- name: Reset failed state of roce-dhcp (in case of previous crash loop)
  become: true
  command: systemctl reset-failed roce-dhcp
  failed_when: false
  changed_when: false

- name: Enable and start roce-dhcp (DPU)
  become: true
  systemd:
    name: roce-dhcp
    enabled: true
    state: started
    daemon_reload: true

- name: Install roce-tc-watchdog-dpu script
  become: true
  copy:
    src: roce-tc-watchdog-dpu.py
    dest: /usr/local/bin/roce-tc-watchdog-dpu.py
    mode: '0755'

- name: Install roce-tc-watchdog-dpu systemd service
  become: true
  copy:
    src: roce-tc-watchdog-dpu.service
    dest: /etc/systemd/system/roce-tc-watchdog-dpu.service
    mode: '0644'

- name: Install roce-tc-watchdog-dpu systemd timer
  become: true
  copy:
    src: roce-tc-watchdog-dpu.timer
    dest: /etc/systemd/system/roce-tc-watchdog-dpu.timer
    mode: '0644'

- name: Enable and start roce-tc-watchdog-dpu timer
  become: true
  systemd:
    name: roce-tc-watchdog-dpu.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Install roce-gc-dpu-ovs.sh
  become: true
  copy:
    src: roce-gc-dpu-ovs.sh
    dest: /usr/local/bin/roce-gc-dpu-ovs.sh
    mode: '0755'

- name: Install roce-gc-dpu-ovs systemd units
  become: true
  copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - roce-gc-dpu-ovs.service
    - roce-gc-dpu-ovs.timer

- name: Enable and start roce-gc-dpu-ovs timer
  become: true
  systemd:
    name: roce-gc-dpu-ovs.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Update nova.conf [dpu] section
  become: true
  ini_file:
    path: /etc/kolla/nova-compute/nova.conf
    section: dpu
    option: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: roce_sidecar_url,  value: "http://127.0.0.1:9967" }
    - { key: roce_sf_num_min,   value: "800" }
    - { key: roce_sf_num_max,   value: "999" }
    - { key: roce_ovs_bridge,   value: "{{ roce_dhcp_dpu_ovs_bridge }}" }
  notify: restart nova_compute
