---
- name: Create roce-dhcp config dir
  become: true
  file:
    path: "{{ roce_dhcp_env_dir }}"
    state: directory
    mode: '0750'

- name: Template env file
  become: true
  template:
    src: env.j2
    dest: "{{ roce_dhcp_env_dir }}/env"
    mode: '0640'
  notify: restart roce-dhcp

- name: Deploy roce_sidecar.py to compute host
  become: true
  copy:
    src: "{{ role_path }}/files/roce_sidecar.py"
    dest: "{{ roce_dhcp_env_dir }}/roce_sidecar.py"
    mode: '0644'
  notify: restart roce-dhcp

- name: Template libvirt hook
  become: true
  template:
    src: hook_qemu.sh.j2
    dest: /etc/kolla/nova-libvirt/hooks_qemu
    mode: '0755'
  register: _hook

- name: Read nova-libvirt config.json
  become: true
  slurp:
    src: /etc/kolla/nova-libvirt/config.json
  register: _libvirt_cfg_raw

- name: Inject hook entry into nova-libvirt config.json
  become: true
  vars:
    _cfg: "{{ _libvirt_cfg_raw.content | b64decode | from_json }}"
    _files: "{{ _cfg.config_files | default([]) }}"
    _hook_entry:
      source: "/var/lib/kolla/config_files/hooks_qemu"
      dest: "/etc/libvirt/hooks/qemu"
      owner: "root"
      perm: "0755"
  copy:
    content: "{{ _cfg | combine({'config_files': _files + [_hook_entry]}) | to_nice_json }}"
    dest: /etc/kolla/nova-libvirt/config.json
  when: "'/etc/libvirt/hooks/qemu' not in (_files | map(attribute='dest') | list)"
  notify: restart nova_libvirt

- name: Ensure hooks dir exists in nova_libvirt container
  become: true
  command: podman exec nova_libvirt mkdir -p /etc/libvirt/hooks
  when: _hook.changed

- name: Copy hook into running nova_libvirt container
  become: true
  command: >
    podman cp /etc/kolla/nova-libvirt/hooks_qemu
    nova_libvirt:/etc/libvirt/hooks/qemu
  when: _hook.changed
  notify: restart nova_libvirt
